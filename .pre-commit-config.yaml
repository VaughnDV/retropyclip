repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: mypy-core
        name: mypy (typed core)
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: forbidden-credential-filenames
        name: reject credential and recovery filenames
        language: fail
        files: '(^|/)(client_secret[^/]*\.json|credentials[^/]*\.json|token[^/]*\.json|recovery[^/]*\.txt)$'
