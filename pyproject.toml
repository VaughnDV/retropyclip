[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "retropyclip"
version = "0.1.0"
description = "Private-first, encrypted clipboard history and text sync"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RetroPyClip contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "google-api-python-client>=2.149,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25.4,<27",
  "platformdirs>=4.3,<5",
  "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
retropyclip = "retropyclip.cli:app"
retropyclip-tray = "retropyclip.ui.tray:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retropyclip"]

[tool.hatch.build.targets.sdist]
include = ["src/retropyclip", "tests", "docs", "README.md", "LICENSE", "SECURITY.md"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["retropyclip"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["AppKit", "ApplicationServices", "Quartz"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["retropyclip.sync.auth"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["retropyclip.ui.*"]
ignore_errors = true
