<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="RetroPyClip demo flow">
  <rect width="960" height="240" fill="#11141A"/>
  <g font-family="Menlo, monospace" font-size="14" fill="#F8F1DF">
    <rect x="16" y="24" width="216" height="192" fill="#181D26" stroke="#16D9E3" stroke-width="2"/>
    <text x="28" y="52" fill="#16D9E3">1. CAPTURE</text>
    <text x="28" y="88">demo: standup notes</text>
    <text x="28" y="112">stored locally</text>
    <rect x="248" y="24" width="216" height="192" fill="#181D26" stroke="#F2B134" stroke-width="2"/>
    <text x="260" y="52" fill="#F2B134">2. SEARCH / COPY</text>
    <text x="260" y="88">filter history</text>
    <text x="260" y="112">copy exact text</text>
    <rect x="480" y="24" width="216" height="192" fill="#181D26" stroke="#16D9E3" stroke-width="2"/>
    <text x="492" y="52" fill="#16D9E3">3. ENCRYPT</text>
    <text x="492" y="88">AES-256-GCM</text>
    <text x="492" y="112">tamper rejected</text>
    <rect x="712" y="24" width="232" height="192" fill="#181D26" stroke="#4ED17A" stroke-width="2"/>
    <text x="724" y="52" fill="#4ED17A">4. CONVERGE</text>
    <text x="724" y="88">offline clips merge</text>
    <text x="724" y="112">after sync</text>
  </g>
</svg>
